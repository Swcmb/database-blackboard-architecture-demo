events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # 前端静态文件
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # 代理 DB Service API
        location /api/db/ {
            proxy_pass http://db-service:8001/api/db/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 代理 Blackboard Service API
        location /api/blackboard/ {
            proxy_pass http://blackboard-service:8002/api/blackboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
